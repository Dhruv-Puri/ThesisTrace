# Paper2Reality — one command runs the whole system:
#   docker compose up --build
# web UI → http://localhost:8080   API → http://localhost:8000/api/health
#
# Installs nothing on the host except Docker itself. The only persistent state
# is the project-local .data/ folder (models + uploads), bind-mounted below,
# so deleting this folder removes everything the app created.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /models/hf
      P2R_DATA_DIR: /data                 # host: ./.data (project-local)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}   # from .env; empty = fully local mode
      LOW_RAM: ${LOW_RAM:-0}
      SEMANTIC: ${SEMANTIC:-0}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./.data/hf:/models/hf     # HF weights: downloaded once, survives rebuilds
      - ./.data:/data             # uploads + job results (inside this folder)
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
