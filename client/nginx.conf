# Serve the built React app and proxy /api to the api service (compose DNS name).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1 MB, which rejects real papers before they reach the
    # API. Keep this just above the API's own 30 MB limit (config.MAX_UPLOAD_MB)
    # so the API, not the proxy, owns the size decision and returns its JSON 413.
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;    # long analyses must not be cut off
    }

    location / {
        try_files $uri /index.html; # SPA fallback
    }
}
